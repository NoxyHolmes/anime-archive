<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход владельца</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #100c15; color: #f3eef6; font-family: 'Onest', system-ui, sans-serif; }
  .container { text-align: center; max-width: 400px; padding: 32px; background: #181224; border: 1px solid #2b2138; border-radius: 16px; }
  h1 { font-size: 20px; margin-bottom: 16px; color: #ff7aa2; }
  p { color: #a094b2; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
  .spinner { width: 40px; height: 40px; border: 3px solid #2b2138; border-top-color: #ff7aa2; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  .btn { display: inline-block; padding: 10px 20px; background: #ff7aa2; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; transition: .2s; }
  .btn:hover { background: #ff5a8a; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
<div class="container">
  <div id="step-loading">
    <h1>🔐 Проверка ссылки...</h1>
    <p>Автоматический вход в режим владельца.</p>
    <div class="spinner"></div>
  </div>
  <div id="step-error" class="hidden">
    <h1 class="error">❌ Ошибка доступа</h1>
    <p>Ссылка недействительна или токен не совпадает.</p>
    <a href="index.html" class="btn">Вернуться на главную</a>
  </div>
</div>
<script>
const LS_ACCESS = 'anime_access_token';
const LS_OWNER = 'anime_owner_mode';

const urlParams = new URLSearchParams(window.location.search);
const urlToken = urlParams.get('access');
const savedToken = localStorage.getItem(LS_ACCESS);

setTimeout(() => {
  if (urlToken) {
    // Если это первый запуск с этой ссылкой, сохраняем токен
    if (!savedToken) {
      localStorage.setItem(LS_ACCESS, urlToken);
    }
    
    // Проверяем совпадение
    if (localStorage.getItem(LS_ACCESS) === urlToken) {
      // УСПЕХ: Выдаем права владельца и мгновенно перенаправляем
      localStorage.setItem(LS_OWNER, 'true');
      window.location.href = 'index.html';
    } else {
      // НЕУДАЧА
      document.getElementById('step-loading').classList.add('hidden');
      document.getElementById('step-error').classList.remove('hidden');
    }
  } else {
    document.getElementById('step-loading').classList.add('hidden');
    document.getElementById('step-error').classList.remove('hidden');
  }
}, 600);
</script>
</body>
</html>
