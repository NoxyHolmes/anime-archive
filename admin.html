<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход владельца</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #100c15; color: #f3eef6; font-family: 'Onest', system-ui, sans-serif; }
  .loader { text-align: center; }
  .spinner { width: 44px; height: 44px; border: 3px solid #2b2138; border-top-color: #ff7aa2; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-family: 'JetBrains Mono'; font-size: 12px; letter-spacing: 2px; color: #a094b2; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>вход владельца...</p>
  </div>
  <script>
    // Устанавливаем флаг владельца и сразу редиректим на главную
    localStorage.setItem('anime_owner_mode', 'true');
    // Через 800мс переходим — чтобы пользователь увидел анимацию
    setTimeout(() => { window.location.href = 'index.html'; }, 800);
  </script>
</body>
</html>
